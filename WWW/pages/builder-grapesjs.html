<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Builder - Multigrounds</title>
    
    <!-- GrapesJS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        /* Custom top bar */
        #custom-topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2c3e50;
            color: white;
            display: none;
            align-items: center;
            padding: 0 20px;
            z-index: 10000;
            gap: 15px;
        }
        
        #custom-topbar .page-info {
            flex: 1;
            font-size: 14px;
        }
        
        #custom-topbar .btn {
            padding: 6px 15px;
            font-size: 13px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #custom-topbar .btn:hover {
            background: #2980b9;
        }
        
        #custom-topbar .btn-success {
            background: #27ae60;
        }
        
        #custom-topbar .btn-success:hover {
            background: #229954;
        }
        
        #custom-topbar .unsaved-indicator {
            color: #ffc107;
            font-size: 12px;
            margin-left: 10px;
        }
        
        /* GrapesJS container */
        #gjs {
            margin-top: 50px;
            height: calc(100vh - 50px);
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div style="text-align: center;">
            <h4>Loading Page Builder...</h4>
            <p>Please wait...</p>
        </div>
    </div>

    <!-- Custom top bar -->
    <div id="custom-topbar">
        <div class="page-info">
            Editing: <strong id="current-subdomain"></strong>
            <span id="unsaved-indicator" class="unsaved-indicator" style="display: none;">
                <i class="fas fa-circle"></i> Unsaved
            </span>
        </div>
        <button class="btn" onclick="previewPage()">
            <i class="fas fa-eye"></i> Preview
        </button>
        <button id="save-btn" class="btn btn-success" onclick="savePage()">
            <i class="fas fa-save"></i> Save & Publish
        </button>
        <button class="btn" onclick="goToMyPages()">
            <i class="fas fa-list"></i> My Pages
        </button>
        <button class="btn" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
        </button>
    </div>

    <!-- GrapesJS Editor -->
    <div id="gjs"></div>

    <!-- GrapesJS -->
    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-blocks-basic"></script>
    
    <!-- Our integration -->
    <script src="builder-grapesjs.js"></script>
</body>
</html>
